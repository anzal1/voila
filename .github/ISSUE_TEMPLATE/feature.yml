name: Feature request
description: Suggest something voila should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The demo you are trying to make, and what stops you today.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
