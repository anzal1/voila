name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: record on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: install chromium (retry; hosted apt mirrors are flaky)
        shell: bash
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, retrying"
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update || true; fi
            sleep 20
          done
          exit 1
      - name: record a demo (no narration)
        run: node cli.js record https://example.com --no-narrate --out ci-out
      - name: verify the mp4 exists and carries its recipe
        run: node cli.js review ci-out/demo.mp4 --frames 3
      - name: doctor, voices, fork, rerender
        if: matrix.os == 'ubuntu-latest'
        run: |
          node cli.js --version
          node cli.js doctor --check || true
          node cli.js voices | head -5
          node cli.js fork ci-out/demo.mp4 --print | head -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}
          path: ci-out/demo.mp4
          if-no-files-found: warn

  narrate:
    name: narrated record on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: install chromium (retry; hosted apt mirrors are flaky)
        shell: bash
        run: |
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, retrying"
            if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update || true; fi
            sleep 20
          done
          exit 1
      - name: record with on-device TTS
        run: node cli.js record https://example.com --steps ci-narrate.yaml --out ci-out
      - name: verify audio track is present
        run: node scripts/check-audio.js ci-out/demo.mp4
