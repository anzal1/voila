name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: record on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: record a demo (no narration)
        run: node cli.js record https://example.com --no-narrate --out ci-out
      - name: verify the mp4 exists and carries its recipe
        run: node cli.js review ci-out/demo.mp4 --frames 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.os }}
          path: ci-out/demo.mp4
          if-no-files-found: warn

  narrate:
    name: narrated record (linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: record with on-device TTS
        run: node cli.js record https://example.com --steps ci-narrate.yaml --out ci-out
      - name: verify audio track is present
        run: |
          node -e "
          const {execFileSync}=require('child_process');
          const ff=require('ffmpeg-static');
          let out='';
          try { execFileSync(ff,['-i','ci-out/demo.mp4'],{stdio:'pipe'}); }
          catch(e){ out=String(e.stderr); }
          if(!/Audio: aac/.test(out)) { console.error(out); throw new Error('no narration track'); }
          console.log('narration track OK');
          "
